# Public daemon API — no auth_request (monitoring / FE About / boot metadata).
# Must be included BEFORE `location /api/` so exact match wins over the prefix.
# Daemon itself keeps /api/version open (Health/version remain open for probes).
# SSOT: apps/daemon/src/server.ts GET /api/version

location = /api/version {
    proxy_pass http://open_design_daemon_hashed;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer $teamver_od_api_token";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
