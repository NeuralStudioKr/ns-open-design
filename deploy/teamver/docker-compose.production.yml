# Production override — teamver-design-api env_file (symlink .env 불필요).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env.production ...

services:
  open-design-daemon:
    build:
      args:
        VITE_TEAMVER_HOSTED_CHAT_API_ENABLED: ${VITE_TEAMVER_HOSTED_CHAT_API_ENABLED:-1}
    environment:
      TEAMVER_HOSTED_CHAT_API_ENABLED: ${TEAMVER_HOSTED_CHAT_API_ENABLED:-1}
      TEAMVER_HOSTED_CHAT_BUFFERED_STREAM_ENABLED: ${TEAMVER_HOSTED_CHAT_BUFFERED_STREAM_ENABLED:-1}
      OD_SCRATCH_EVICT_AFTER_RUN: "1"
      OD_SCRATCH_EVICT_IDLE: ${OD_SCRATCH_EVICT_IDLE:-1}
      OD_SCRATCH_EVICT_IDLE_AFTER_MS: ${OD_SCRATCH_EVICT_IDLE_AFTER_MS:-}
      OD_S3_SYNC_UP_METRICS: "1"
      OD_SCRATCH_DISK_METRICS: "1"
      OD_SCRATCH_DISK_THRESHOLD_MB: ${OD_SCRATCH_DISK_THRESHOLD_MB:-2048}
      OD_SCRATCH_DISK_METRIC_INTERVAL_MS: ${OD_SCRATCH_DISK_METRIC_INTERVAL_MS:-300000}
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      OD_EXPORT_MAX_CONCURRENT: ${OD_EXPORT_MAX_CONCURRENT:-6}
      OD_EXPORT_BROWSER_POOL_SIZE: ${OD_EXPORT_BROWSER_POOL_SIZE:-3}
      OD_EXPORT_QUEUE_MAX: ${OD_EXPORT_QUEUE_MAX:-64}
      OD_EXPORT_TICKET_TTL_SEC: ${OD_EXPORT_TICKET_TTL_SEC:-300}
      OD_EXPORT_PPTX_MAX_SLIDES: ${OD_EXPORT_PPTX_MAX_SLIDES:-40}
      OD_EXPORT_WORKER_ENABLED: ${OD_EXPORT_WORKER_ENABLED:-0}
      OD_EXPORT_WORKER_BASE_URL: ${OD_EXPORT_WORKER_BASE_URL:-http://export-worker:7460}
      OD_EXPORT_WORKER_TIMEOUT_MS: ${OD_EXPORT_WORKER_TIMEOUT_MS:-120000}
      OD_EXPORT_WORKER_DAEMON_URL: ${OD_EXPORT_WORKER_DAEMON_URL:-http://open-design-daemon:7456}
      OD_EXPORT_OFFLOAD_ENABLED: ${OD_EXPORT_OFFLOAD_ENABLED:-1}
      OD_EXPORT_OFFLOAD_REQUIRED: ${OD_EXPORT_OFFLOAD_REQUIRED:-1}

  teamver-design-api:
    env_file:
      - .env.production
    environment:
      TEAMVER_DEPLOY_ENV: production
      AUTH_DISABLED: "false"
      ALLOW_NO_JWT_LOCAL_MODE: "false"
      OD_PROJECT_STORAGE: ${OD_PROJECT_STORAGE:?Set OD_PROJECT_STORAGE=s3 in .env.production}
