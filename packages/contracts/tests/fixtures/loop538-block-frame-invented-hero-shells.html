<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8" />
  <title>Teamver — 팀의 AI 업무 공간</title>
  <style>
    :root { --cream:#F7EAA1; --pink:#FE90E8; --blue:#C0F7FE; --green:#99E885; --ink:#0A0A0A; }
    body { background: var(--cream); color: var(--ink); font-family: 'Space Grotesk', sans-serif; }
    .slide { width: 1920px; height: 1080px; padding: 40px; box-sizing: border-box; }
    .slide-1 .hero-frame { padding: 60px; border: 6px solid var(--ink); }
    .hero-label { display: inline-block; padding: 6px 14px; background: var(--green); border: 3px solid var(--ink); }
    .hero-title { font-size: 96px; font-weight: 900; line-height: 1.05; }
    .hero-subtitle { font-size: 24px; }
    .nb-btn { display: inline-block; padding: 14px 28px; background: var(--ink); color: white; }
    .deco-yellow-bar { padding: 8px 16px; background: yellow; }
  </style>
</head>
<body>
  <section class="slide slide-1 active">
    <div class="deco-dots"></div>
    <div class="hero-frame">
      <div class="corner-bracket tl"></div>
      <div class="corner-bracket tr"></div>
      <div class="corner-bracket bl"></div>
      <div class="corner-bracket br"></div>
      <div class="nb-label hero-label">09</div>
      <h1 class="nb-heading-xl hero-title">팀의 AI 업무 공간을 <span class="hero-title-highlight">지금 시작</span> 하세요.</h1>
      <p class="hero-subtitle">작은 팀은 무료로 시작하고, 조직과 교육기관은 Teamver 도입 상담을 요청하세요.</p>
      <div class="deco-pink-rect"></div>
      <div class="deco-green-circle"></div>
      <div class="deco-yellow-bar">Get Started</div>
      <div class="hero-cta-row">
        <a class="nb-btn hero-cta cta-primary">▶ 무료로 시작하기</a>
        <a class="nb-btn hero-cta cta-secondary">Enterprise 데모</a>
      </div>
      <div class="download-cards">
        <div class="download-card">
          <h3>🖥️ Desktop</h3>
        </div>
        <div class="download-card">
          <h3>🤖 Android</h3>
        </div>
        <div class="download-card">
          <h3>🍎 iOS</h3>
          <p>teamver · NeuralStudio · 대표 김형민, 한대희 · 사업자등록번호 699-86-03820 [본사] 서울 서대문구 연희로 160 2층 · [판교 R&D] 경기 성남시 분당구 금토로 80번길 40 B동 601호</p>
        </div>
      </div>
    </div>
  </section>
</body></html>
