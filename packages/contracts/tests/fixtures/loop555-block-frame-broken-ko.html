<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Teamver</title>
  <style>
    :root { --cream:#FFDC8B; --pink:#FE90E8; --blue:#C0F7FE; --green:#99E885; --yellow:#F7CB46; --ink:#000; }
    .nb-heading-xl, .nb-heading-lg { font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; }
    .nb-label { letter-spacing: 0.08em; text-transform: uppercase; }
    .slide-1 .hero-frame { border: 6px solid var(--ink); }
    .slide-7 .timeline-step { }
    .slide-7 .step-title { text-transform: uppercase; letter-spacing: 0.08em; }
    .slide-2 .intro-card h3 { text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <section class="slide slide-7">
    <div class="nb-label nb-label-yellow">고객 경험</div>
    <h2 class="nb-heading-lg">고객경험</h2>
    <div class="timeline">
      <div class="timeline-step">
        <div class="step-num">01</div>
        <div class="step-title">파일떴</div>
        <p class="step-desc">작은 팀이나 단일 업무에서 빠르게 파일럿을 시작</p>
      </div>
      <div class="timeline-step">
        <div class="step-num">02</div>
        <div class="step-title">희대다</div>
        <p class="step-desc">반복 사용 패턴을 기준으로 템플릿과 권한 정책을 확장</p>
      </div>
      <div class="timeline-step">
        <div class="step-num">03</div>
        <div class="step-title">정척적</div>
        <p class="step-desc">성과 지표와 운영 책임을 정해 조직 표준으로 정착</p>
      </div>
    </div>
  </section>
  <section class="slide slide-2">
    <div class="nb-label nb-label-yellow">근거와 사례</div>
    <h2 class="nb-heading-lg">근거와사례</h2>
    <div class="col-right">
      <div class="intro-card">
        <h3>실무자</h3>
        <p>반복 작업을 줄이고 결과물 완성도를 높이는 방식</p>
      </div>
      <div class="intro-card">
        <h3>리더</h3>
        <p>팀 속도, 품질, 비용을 함께 관리할 수 있는 기준</p>
      </div>
      <div class="intro-card">
        <h3>운영자</h3>
        <p>권한, 저장, 감사, 보안 요구를 만족시키는 운영 체계</p>
      </div>
    </div>
  </section>
</body>
</html>
